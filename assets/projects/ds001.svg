<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t">
<title id="t">Cadeia do loader: JAR, ConfigProvider com AES/CBC, payload p.bin, arquivo javaw.exe e PowerShell oculto. Nada foi executado.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E151E"/><stop offset="1" stop-color="#0B1016"/></linearGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1C2836"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4z" fill="#F0B04A"/></marker>
  <style>
    text{font-family:"JetBrains Mono",Consolas,monospace}
    .b{fill:#121A24;stroke:#33445A;stroke-width:1.5}
    .h{fill:#D6DEE8;font-size:24px;font-weight:700}
    .s{fill:#8C9AAE;font-size:18px}
    .a{fill:#F0B04A;font-size:18px}
    .l{stroke:#F0B04A;stroke-width:2;fill:none;marker-end:url(#ar)}
  </style>
</defs>
<rect width="1280" height="800" fill="url(#bg)"/><rect width="1280" height="800" fill="url(#dots)"/>

<text x="64" y="84" class="a">&gt; static analysis, sem execução</text>

<g transform="translate(64,150)"><rect class="b" width="320" height="130" rx="14"/><text x="24" y="50" class="h">shadowvale.jar</text><text x="24" y="84" class="s">entregue por Discord</text><text x="24" y="110" class="s">3 classes + p.bin</text></g>
<path class="l" d="M384 215H470"/>

<g transform="translate(470,150)"><rect class="b" width="320" height="130" rx="14"/><text x="24" y="50" class="h">ConfigProvider</text><text x="24" y="84" class="s">AES/CBC, IV estático</text><text x="24" y="110" class="s">strings em runtime</text></g>
<path class="l" d="M790 215H876"/>

<g transform="translate(876,150)"><rect class="b" width="340" height="130" rx="14"/><text x="24" y="50" class="h">p.bin ~5,99 MB</text><text x="24" y="84" class="s">payload cifrado</text><text x="24" y="110" class="s">decifrado em memória</text></g>
<path class="l" d="M1046 280V360"/>

<g transform="translate(876,360)"><rect class="b" width="340" height="130" rx="14"/><text x="24" y="50" class="h">.mc-cache\javaw.exe</text><text x="24" y="84" class="s">masquerading</text><text x="24" y="110" class="s">pasta oculta</text></g>
<path class="l" d="M876 425H790"/>

<g transform="translate(470,360)"><rect class="b" width="320" height="130" rx="14"/><text x="24" y="50" class="h">PowerShell</text><text x="24" y="84" class="s">-WindowStyle Hidden</text><text x="24" y="110" class="s">-Verb RunAs</text></g>

<g transform="translate(64,360)"><rect width="320" height="130" rx="14" fill="none" stroke="#F0B04A" stroke-width="1.5" stroke-dasharray="7 7"/><text x="24" y="50" class="h">Stage 2</text><text x="24" y="84" class="a">nunca executado</text><text x="24" y="110" class="s">sem afirmações</text></g>
<path d="M470 425H384" stroke="#F0B04A" stroke-width="2" stroke-dasharray="3 7" fill="none" marker-end="url(#ar)"/>

<g font-size="18">
  <text x="64" y="600" fill="#7FD1A0">confirmado</text><text x="220" y="600" class="s">loader grava e tenta executar o payload</text>
  <text x="64" y="640" fill="#7FD1A0">confirmado</text><text x="220" y="640" class="s">AES/CBC, reflexão, MethodHandle</text>
  <text x="64" y="680" fill="#F0B04A">não provado</text><text x="220" y="680" class="s">comportamento do Stage 2 e do IP 163.5.102.220</text>
</g>
<text x="64" y="750" class="s">MITRE: T1566.001 · T1140 · T1027.002 · T1059.001 · T1564.003 · T1548.002 · T1036.005</text>
</svg>
